<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste of Africa | Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a href="index.html" class="logo">Taste of Africa</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="recipes.html">Recipes</a></li>
                <li><a href="east-africa.html">East Africa</a></li>
                <li><a href="west-africa.html">West Africa</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <form id="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="country">Country</label>
            <input type="text" id="country" list="countries">
            <datalist id="countries">
                <option value="Rwanda"></option>
                <option value="Uganda"></option>
                <option value="Kenya"></option>
                <option value="Tanzania"></option>
                <option value="Nigeria"></option>
                <option value="Ghana"></option>
                <option value="South Africa"></option>
                <option value="Ethiopia"></option>
            </datalist>

            <label for="message">Message</label>
            <textarea id="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <p id="form-message"></p>
        
    </main>

    <footer>
        <p>&copy; 2026 Taste of Africa</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
